# Netatmo fűtés kártya – példák
# Részletek: docs/netatmo-heating-capabilities.md

# 1) A legegyszerűbb: a kártya magától megtalálja a szobákat és az ütemtervet
- type: custom:netatmo-heating-card

# 2) Kültéri hőmérséklettel. A csatlakozás-jelző azért kell, mert egy leszakadt
#    Netatmo modul nem unavailable lesz, hanem megtartja a régi értékét.
- type: custom:netatmo-heating-card
  language: hu
  sources:
    outside: sensor.netatmo_weather_station_outdoor_module_temperature
    outside_connectivity: binary_sensor.netatmo_weather_station_outdoor_module_csatlakozas

# 3) Nyitásérzékelőkkel. Terület alapján magától párosít; itt csak a
#    kivételeket soroljuk fel.
- type: custom:netatmo-heating-card
  openings:
    ignore:
      - binary_sensor.belso_ajto_contact
    rooms:
      # ez az érzékelő Node-RED-ből jön, nincs eszköze, ezért nincs területe
      climate.halo_szoba_netatmo_valve:
        - binary_sensor.terasz_ajto_sensor
  open_delay: 60

# 4) Saját szobanevek, kompakt elrendezés
- type: custom:netatmo-heating-card
  compact: true
  show_art: false
  rooms:
    climate.kis_szoba_netatmo_valve:
      name: Vendégszoba

# Bukó-nyíló ablak: két kontaktus egy szárnyon, nem két ablak. Ha csak a
# felső van nyitva, az ablak bukóra van. A `_top`/`_bottom`, `_felso`/`_also`
# és `_upper`/`_lower` végződéseket magától párosítja; ez a blokk csak akkor
# kell, ha a te azonosítóid nem követnek konvenciót.
- type: custom:netatmo-heating-card
  openings:
    windows:
      # AZ ELSŐ A FELSŐ KONTAKTUS
      Hálószoba ablak:
        - binary_sensor.zigbee_0x001
        - binary_sensor.zigbee_0x002
    # vagy, ha csak a végződésed más:
    pairs:
      - [buko, nyilo]

# EGY SZOBA KÁRTYÁJA
# Add meg a szoba climate entitását, és a kártya szobakártyává alakul:
# a szoba saját hőmérséklete nagyban, a saját eszköze rajzolva, a fűtési
# igénye sávval, és rögtön ott a hőfokállítás.
- type: custom:netatmo-heating-card
  entity: climate.halo_szoba

# Ugyanez a vizuális szerkesztőből: az eszközválasztó ezt írja be.
# A szoba MINDEN feje megjelenik, nem csak a kiválasztott.
- type: custom:netatmo-heating-card
  device: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d

# Szobakártya, de a házmód-sávval együtt. Vigyázz: az üzemmód az EGÉSZ
# házra vonatkozik, nem csak erre a szobára.
- type: custom:netatmo-heating-card
  entity: climate.halo_szoba
  show_modes: true

# Kompakt szobakártya mobil dashboardra, rajz nélkül
- type: custom:netatmo-heating-card
  entity: climate.furdoszoba
  compact: true
  show_art: false
