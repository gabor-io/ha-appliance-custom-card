# Daikin klíma kártya – példák
# Részletek: docs/daikin-capabilities.md

# 1) A lehető legegyszerűbb: egyetlen Daikin klímánál még az entitás sem kell
- type: custom:daikin-ac-card

# 2) Egy gép, szobában mérő hőmérővel és konnektormérővel
- type: custom:daikin-ac-card
  entity: climate.halo_szoba
  name: Hálószoba
  language: hu
  sources:
    temperature: sensor.halo_szoba_homerseklet
    humidity: sensor.halo_szoba_paratartalom
    power: sensor.halo_szoba_klima_teljesitmeny

# 3) Négy gép egy kártyán, climate_group entitással.
#    A tagokat nem kell felsorolni - a csoport maga adja meg oket.
- type: custom:daikin-ac-card
  entity: climate.daikin_acs
  name: Klímák
  units:
    climate.halo_szoba:
      name: Hálószoba
      sources:
        temperature: sensor.halo_szoba_homerseklet
        power: sensor.halo_szoba_klima_teljesitmeny
    climate.nappali:
      name: Nappali
      sources:
        temperature: sensor.nappali_homerseklet
        power: sensor.nappali_klima_teljesitmeny
    # a tobbi gep a sajat homerojet hasznalja, amig nincs szenzor a szobaban

# 4) Kompakt, csak a lényeg - mobil dashboardra
- type: custom:daikin-ac-card
  entity: climate.gyerekszoba
  compact: true
  show_art: false
  show_presets: false

# 5) Ha a gépedben tényleg van oldalirányú terelés
- type: custom:daikin-ac-card
  entity: climate.nappali
  show_all_swing: true

# 6) Nyitásérzékelők. Alapból nem kell beállítani semmit: a kártya a klíma
#    területéről szedi össze az ablakkontaktusokat. Ez a blokk csak akkor
#    kell, ha el akarsz térni az alaptól.
- type: custom:daikin-ac-card
  entity: climate.nappali
  openings:
    # az ajtók alapból nem számítanak - a mosogatógép ajtaja nem huzat
    classes: [window, door]
    # kontaktus, aminek nincs eszköze, tehát területe sem
    entities:
      - binary_sensor.terasz_ajto
    # ez a szellőző szándékosan nyitva van, ne szóljon miatta
    ignore:
      - binary_sensor.nappali_szellozo
  # 30 másodperc helyett 2 perc, ha sokat nyitogatjátok
  open_delay: 120

# 7) Ha nem akarod látni egyáltalán
- type: custom:daikin-ac-card
  entity: climate.dolgozo
  show_openings: false

# 8) Bukó-nyíló ablak: két kontaktus egy szárnyon. A `_top`/`_bottom`,
#    `_felso`/`_also` és `_upper`/`_lower` végződéseket magától párosítja,
#    ez a blokk csak akkor kell, ha a te azonosítóid mások.
- type: custom:daikin-ac-card
  entity: climate.halo_szoba
  openings:
    windows:
      # AZ ELSŐ A FELSŐ KONTAKTUS - abból derül ki a bukó állapot
      Hálószoba ablak:
        - binary_sensor.zigbee_0x001
        - binary_sensor.zigbee_0x002
