# Médiaszoba kártya – példák
# Részletek: docs/media-capabilities.md

# 1) A tipikus eset: egy képernyő, két forrás.
#    Amelyik épp megy, az látszik.
- type: custom:media-room-card
  name: Hálószoba
  entities:
    - media_player.halo_box
    - media_player.halo_tv_plex

# 2) A sorrend dönt, ha mindkettő ugyanabban az állapotban van.
#    Itt a TV appja az elsődleges.
- type: custom:media-room-card
  name: Nappali
  entities:
    - media_player.nappali_tv_plex
    - media_player.nappali_box
    - media_player.nappali_hangszoro

# 3) A kép az egyik dobozé, a hang a TV-é.
#    A box supported_features-ében nincs hangerő, a TV-ében van: a csúszka
#    ezért mindig a TV-re megy, a lejátszás/szünet meg arra, ami játszik.
#    A TV az entities listában is ott van, a végén: adásnézéskor (amikor
#    semmi nem "playing") így a kártya a TV-t mutatja, logóval.
- type: custom:media-room-card
  name: Hálószoba
  entities:
    - media_player.halo_box
    - media_player.halo_televizio
  volume_entity: media_player.halo_televizio

# 4) Mobil dashboardra: tömör, borító és hangerő nélkül
- type: custom:media-room-card
  name: Hálószoba
  compact: true
  show_volume: false
  entities:
    - media_player.halo_box
    - media_player.halo_tv_plex

# 5) Egyetlen lejátszóhoz is jó – ilyenkor a lejátszók sora elmarad
- type: custom:media-room-card
  entity: media_player.konyha_radio

# 6) Saját néven, ha az entitás neve nem a szobáról szól
- type: custom:media-room-card
  name: Dolgozó
  entities:
    - entity: media_player.pc_plex
      name: Gép
    - entity: media_player.monitor_tv
      name: Monitor
