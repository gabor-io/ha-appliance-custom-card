# Médiaszoba kártya – példák
# Részletek: docs/media-capabilities.md

# 1) A tipikus eset: egy képernyő, két forrás.
#    Amelyik épp megy, az látszik.
- type: custom:media-room-card
  name: Hálószoba
  entities:
    - media_player.halo_box
    - media_player.halo_tv_plex

# 2) A sorrend dönt, ha mindkettő ugyanabban az állapotban van.
#    Itt a TV appja az elsődleges.
- type: custom:media-room-card
  name: Nappali
  entities:
    - media_player.nappali_tv_plex
    - media_player.nappali_box
    - media_player.nappali_hangszoro

# 3) A kép az egyik dobozé, a hang a TV-é.
#    A box supported_features-ében nincs hangerő, a TV-ében van: a csúszka
#    ezért mindig a TV-re megy, a lejátszás/szünet meg arra, ami játszik.
#    A TV az entities listában is ott van, a végén: adásnézéskor (amikor
#    semmi nem "playing") így a kártya a TV-t mutatja, logóval.
- type: custom:media-room-card
  name: Hálószoba
  entities:
    - media_player.halo_box
    - media_player.halo_televizio
  volume_entity: media_player.halo_televizio

# 4) Minden, amit a két integráció enged: forrás- és hangzásválasztó,
#    tekerés a sávon, és a doboz saját távirányítója.
#    A pad entitását és billentyűtérképét magától megtalálja a lejátszó
#    eszközéről - ezeket csak akkor írd ki, ha felül akarod bírálni.
- type: custom:media-room-card
  name: Hálószoba
  entities:
    - media_player.halo_box
    - media_player.halo_televizio
  volume_entity: media_player.halo_televizio
  show_sources: true
  show_remote: true
  # remote_entity: remote.halo_box
  # remote_keys: apple        # apple | samsung | saját {gomb: parancs} térkép

# 5) Makrógomb arra, amit a TV csak a saját menüjében enged: Eco mód.
#    A két sorozat egyetlen lépésben tér el (fel háromszor / le háromszor).
#    A TV nem jelenti, hogy be van-e kapcsolva az Eco, ezért két gomb van,
#    és egy helper jegyzi meg, mit küldtél utoljára.
- type: custom:media-room-card
  name: Hálószoba
  entities:
    - media_player.halo_televizio
  #    A sorozat egy UE55MU7052-n bemért útvonal. Három dolog van benne, ami
  #    nem jött volna ki elméletből:
  #      - a Beállítások ENTER-re egyenesen a Kép almenübe ugranak, ezért
  #        kell utána egy KEY_RETURN a kategórialistához;
  #      - a szünetek (ezredmásodperc) nélkül a TV elnyeli a gombokat, amíg
  #        az új képernyőt rajzolja;
  #      - a végén KEY_EXIT, nem több KEY_RETURN: a fölösleges RETURN-ök
  #        HDMI-n át a forráskészülékhez jutnának, és kiléptetnék a futó
  #        appból.
  macros:
    - name: Eco be
      icon: leaf
      keys: [KEY_MENU, 2000,
             KEY_LEFT*10, KEY_ENTER, 2000,
             KEY_RETURN, 1000,
             KEY_DOWN*3, KEY_RIGHT, 1000,
             KEY_DOWN*3, KEY_ENTER, 2000,
             KEY_DOWN*2, KEY_ENTER, 2000,
             KEY_DOWN*3, KEY_ENTER, 1000,
             KEY_EXIT]
      sets: { entity: input_boolean.tv_eco, state: 'on' }
    - name: Eco ki
      icon: leaf_off
      keys: [KEY_MENU, 2000,
             KEY_LEFT*10, KEY_ENTER, 2000,
             KEY_RETURN, 1000,
             KEY_DOWN*3, KEY_RIGHT, 1000,
             KEY_DOWN*3, KEY_ENTER, 2000,
             KEY_DOWN*2, KEY_ENTER, 2000,
             KEY_UP*3, KEY_ENTER, 1000,
             KEY_EXIT]
      sets: { entity: input_boolean.tv_eco, state: 'off' }

# 6) Mobil dashboardra: tömör, borító és hangerő nélkül
- type: custom:media-room-card
  name: Hálószoba
  compact: true
  show_volume: false
  entities:
    - media_player.halo_box
    - media_player.halo_tv_plex

# 7) Egyetlen lejátszóhoz is jó – ilyenkor a lejátszók sora elmarad
- type: custom:media-room-card
  entity: media_player.konyha_radio

# 8) Saját néven, ha az entitás neve nem a szobáról szól
- type: custom:media-room-card
  name: Dolgozó
  entities:
    - entity: media_player.pc_plex
      name: Gép
    - entity: media_player.monitor_tv
      name: Monitor
