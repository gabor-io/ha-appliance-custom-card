# Nanoleaf Shapes kártya – példák
# Részletek: docs/nanoleaf-capabilities.md

# 1) Egyetlen Nanoleafnál még az entitás sem kell
- type: custom:nanoleaf-shapes-card

# 2) Kilenc panel futó cikcakkban: öt lent, négy fent, váltakozva.
#    Ennek neve van, elég egy szó:
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_shapes
  name: Nappali
  layout: zigzag9

#    Ugyanez kiírva, ha el akarsz térni tőle. Lapos tetejű hatszögek:
#    [q+1, r-1] a jobbra-fel szomszéd, [q+1, r] a jobbra-le - ezek
#    váltogatása a cikcakk.
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_shapes
  layout:
    - [0, 0]
    - [1, -1]
    - [2, -1]
    - [3, -2]
    - [4, -2]
    - [5, -3]
    - [6, -3]
    - [7, -4]
    - [8, -4]

# 3) A másik két elnevezett elrendezés
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_shapes
  layout: row5          # öt panel egy sorban
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_shapes
  layout: flower7       # a kezdőkészlet virága (ez az alapértelmezés)

# 4) Kompakt, mobil dashboardra: csak a rajz, a fényerő és a jelenetek
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_shapes
  compact: true
  show_white: false
  show_identify: false
  show_touch: false

# 5) Csak a jelenetválasztó, rajz nélkül
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_shapes
  show_art: false
  show_white: false

# 6) Saját felirat a név alatt (üres sztring elrejti a modellt)
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_shapes
  name: Falikép
  subtitle: "9 panel · nappali"

# 7) Triangles vagy Mini Triangles: nincs érintés-entitás, a sor magától
#    elmarad - ezt nem kell kikapcsolni.
- type: custom:nanoleaf-shapes-card
  entity: light.nanoleaf_haromszogek
