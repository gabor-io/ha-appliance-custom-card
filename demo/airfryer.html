<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philips Airfryer Card – demo</title>
<style>
  body {
    margin: 0; padding: 24px; font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f2f4f7; color: #212121;
    --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #70757a;
    --card-background-color: #ffffff; --divider-color: rgba(127,127,127,.22);
    --success-color: #43a047; --warning-color: #fb8c00; --error-color: #db4437; --info-color: #039be5;
    --state-icon-color: #8a9199; --text-primary-color: #fff;
  }
  body.dark {
    background: #111418; color: #e1e1e1;
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1f26; --divider-color: rgba(255,255,255,.14);
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  button { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  body.dark button { background: #22262e; color: #e1e1e1; border-color: #3a3f48; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; align-items: start; }
  .narrow { max-width: 360px; }
</style>
</head>
<body>
  <div class="toolbar" id="toolbar"></div>
  <div class="grid" id="grid"></div>

<script type="module">
  import './mock-airfryer.js';
  import '../dist/philips-airfryer-card.js';

  class HaCard extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `<style>
        :host { display: block; background: var(--card-background-color, #fff);
          border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
      </style><slot></slot>`;
    }
  }
  customElements.define('ha-card', HaCard);

  const { SCENARIOS, makeHass } = window.demo;
  const grid = document.getElementById('grid');
  const toolbar = document.getElementById('toolbar');

  let current = new Set(['cooking', 'drawer_open', 'probe', 'finished']);

  function draw() {
    grid.replaceChildren();
    for (const key of current) {
      const wrapper = document.createElement('div');
      const card = document.createElement('philips-airfryer-card');
      card.setConfig({ type: 'custom:philips-airfryer-card', device: 'demo-airfryer', prefix: 'airfryer_combi_7000_series_xxl_cloud', language: 'hu' });
      card.hass = makeHass(key);
      const title = document.createElement('h3');
      title.textContent = key;
      wrapper.append(title, card);
      grid.append(wrapper);
    }
  }

  for (const key of Object.keys(SCENARIOS)) {
    const button = document.createElement('button');
    button.textContent = key;
    button.onclick = () => {
      current.has(key) ? current.delete(key) : current.add(key);
      draw();
    };
    toolbar.append(button);
  }
  const dark = document.createElement('button');
  dark.textContent = 'dark';
  dark.onclick = () => document.body.classList.toggle('dark');
  toolbar.append(dark);

  window.showOnly = (keys) => { current = new Set(keys); draw(); };
  draw();
</script>
</body>
</html>
