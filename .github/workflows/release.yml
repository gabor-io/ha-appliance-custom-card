# Tags and publishes a release whenever the version in package.json changes on
# main. Nothing to do by hand: bump the version, merge, and the tag appears.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >>"$GITHUB_OUTPUT"

      - name: Has this version been released already?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} already released, nothing to do"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Rebuild the bundles
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: The committed dist/ must match the sources
        if: steps.check.outputs.exists == 'false'
        run: |
          if ! git diff --quiet -- dist; then
            git diff --stat -- dist
            echo "::error::dist/ is out of date - run 'npm run build' and commit the result"
            exit 1
          fi

      - name: Create the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            dist/*.js \
            --title "v$VERSION" \
            --generate-notes
