name: Panel heater
products:
  - id: csibqkjs0mijthmw
    manufacturer: AENO
    model: AGH0001S
# AENO AGH0001S infrared panel heater, which the Tuya platform calls
# "AENO Premium Heater" in product category qn (heater).
#
# These heaters currently match princess_panel_heater, which describes dps 1,
# 2, 3, 13, 14 and 15 - so on/off, setpoint and room temperature are all that
# reach Home Assistant, while the device also sends power, cumulative energy,
# voltage, current, its own panel temperature, a timer and several settings
# that are simply discarded.
#
# The climate and temperature unit entities below are kept exactly as
# princess_panel_heater has them, so that devices moved over to this config
# keep their existing entity ids and history.
#
# The mapping was derived from 14 diagnostic snapshots of two units, taken
# while changing one setting at a time in the AENO app. The electrical values
# corroborate each other:
#
#   dps 12 = 802 W   and   dps 107/10 x dps 108/1000 = 235.1 V x 3.424 A
#                                                    = 805 W   (0.4% apart)
#
# and dps 101 advanced by 112 Wh over a window in which the element ran for
# about 8.4 minutes at 802 W - which is 112 Wh.
#
# The owner confirmed from the app that dps 7 is the child lock and dps 8 the
# ceiling mount setting, that the setpoint runs 0-40 C, and that the timer
# offers off plus 1 to 24 hours in whole hours.
#
# Not mapped, because no snapshot showed them change: dps 21 (always 0),
# dps 104 (always false) and dps 103 (always 248, which is 120 C in F - so
# most likely the Fahrenheit mirror of the dps 102 maximum, in the same way
# dps 14 and 15 mirror dps 2 and 3, but that was never observed).
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: integer
        name: temperature
        range:
          min: 0
          max: 40
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_set_f
                range:
                  min: 32
                  max: 104
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: cur_temp_f
      - id: 13
        type: string
        name: temperature_unit
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 14
        type: integer
        name: temp_set_f
        range:
          min: 32
          max: 104
        hidden: true
      - id: 15
        type: integer
        name: cur_temp_f
        hidden: true
      # The thermostat's own demand signal, which the device keeps reporting
      # even while it is switched off - but tuya-local returns "off" for the
      # action in that case, so it only shows through when the heater is on.
      - id: 11
        type: string
        name: hvac_action
        mapping:
          - dps_val: heating
            value: heating
          - dps_val: idle
            value: idle
      # In "smart" the element follows the setpoint; in "manual" it runs
      # regardless of it.
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: smart
            value: comfort
          - dps_val: manual
            value: manual

  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit

  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock

  # Set once at installation; it changes how the panel regulates, so it
  # belongs with the settings rather than on a dashboard.
  - entity: switch
    name: Ceiling mount
    category: config
    icon: "mdi:arrow-collapse-up"
    dps:
      - id: 8
        type: boolean
        name: switch

  # How hot the element itself is allowed to get, not a room temperature.
  # Values from 60 to 120 were set from the app.
  - entity: number
    translation_key: maximum_temperature
    class: temperature
    category: config
    mode: slider
    dps:
      - id: 102
        type: integer
        name: value
        unit: C
        range:
          min: 60
          max: 120

  # The indicator on the control box, which the app calls the display even
  # though the panel itself has none. Named rather than keyed on
  # display_brightness, because that translation has no low/medium/high.
  - entity: select
    name: Indicator brightness
    category: config
    icon: "mdi:brightness-6"
    dps:
      - id: 106
        type: string
        name: option
        mapping:
          - dps_val: "off"
            value: "Off"
          - dps_val: low
            value: Low
          - dps_val: medium
            value: Medium
          - dps_val: high
            value: High

  - entity: sensor
    class: power
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: W
        class: measurement

  - entity: sensor
    class: energy
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 1000

  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 107
        type: integer
        name: sensor
        unit: V
        class: measurement
        mapping:
          - scale: 10

  - entity: sensor
    class: current
    category: diagnostic
    dps:
      - id: 108
        type: integer
        name: sensor
        unit: mA
        class: measurement

  # The panel surface, not the room: it climbed from 25 to 70 C over a
  # quarter of an hour of heating while the room stayed at 23-24 C.
  - entity: sensor
    name: Panel temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: C
        class: measurement

  # Off plus 1 to 24 hours in whole hours, as the app offers it. This device
  # spells "off" as "cancel", where most Tuya heaters send "0h".
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
          - dps_val: "9h"
            value: "9h"
          - dps_val: "10h"
            value: "10h"
          - dps_val: "11h"
            value: "11h"
          - dps_val: "12h"
            value: "12h"
          - dps_val: "13h"
            value: "13h"
          - dps_val: "14h"
            value: "14h"
          - dps_val: "15h"
            value: "15h"
          - dps_val: "16h"
            value: "16h"
          - dps_val: "17h"
            value: "17h"
          - dps_val: "18h"
            value: "18h"
          - dps_val: "19h"
            value: "19h"
          - dps_val: "20h"
            value: "20h"
          - dps_val: "21h"
            value: "21h"
          - dps_val: "22h"
            value: "22h"
          - dps_val: "23h"
            value: "23h"
          - dps_val: "24h"
            value: "24h"

  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: min
